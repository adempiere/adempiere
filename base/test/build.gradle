plugins {
	id 'java-library'
	id 'maven-publish'
	id 'signing'
}


repositories {
    mavenLocal()
    mavenCentral()
}

if (JavaVersion.current().isJava8Compatible()) {
    allprojects {
        tasks.withType(Javadoc) {
            options.addStringOption('Xdoclint:none', '-quiet')
        }
    }
}

dependencies {
    // https://mvnrepository.com/artifact/io.vavr/vavr
    implementation group: 'io.vavr', name: 'vavr', version: '0.10.4'

	// https://mvnrepository.com/artifact/commons-lang/commons-lang
	api 'commons-lang:commons-lang:2.1'

	// Local
	api project(path: ':base')
	api project(path: ':org.adempiere.test')

    // https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-api
    api 'org.junit.jupiter:junit-jupiter-api:5.7.0'

    // JUnit 5 runtime for test execution
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'

    // Mockito inline for static mocking support
    testImplementation 'org.mockito:mockito-inline:3.6.0'
}

sourceSets {
	main {
		java {
			srcDirs = ['src']
		}
	}
	test {
		java {
			srcDirs = ['src']
		}
		resources {
			srcDirs = ['src/test/resources']
		}
	}
}

// Test task configuration for running integration tests with Garden World
test {
    useJUnitPlatform()

    // Pass system properties for ADempiere configuration
    systemProperty 'ADEMPIERE_HOME', System.getenv('ADEMPIERE_HOME') ?: project.rootDir.absolutePath

    // Forward runIntegrationTests property for @EnabledIfSystemProperty tests
    if (System.getProperty('runIntegrationTests') != null) {
        systemProperty 'runIntegrationTests', System.getProperty('runIntegrationTests')
    }

    // JVM arguments required by ADempiere
    jvmArgs = [
        '--add-exports', 'java.base/jdk.internal.misc=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '-Dfile.encoding=UTF-8',
        '-Djava.awt.headless=true'
    ]

    // Test logging
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat = 'full'
    }

    // Fail on no tests found (useful for CI)
    failFast = false
}

// Separate task for unit tests only (no database required)
task unitTest(type: Test) {
    useJUnitPlatform {
        includeTags 'UnitTest'
        excludeTags 'IntegrationTest'
    }

    testLogging {
        events "passed", "skipped", "failed"
    }
}

// Task to run all tests including integration tests
task integrationTest(type: Test) {
    useJUnitPlatform {
        includeTags 'IntegrationTest'
    }

    systemProperty 'ADEMPIERE_HOME', System.getenv('ADEMPIERE_HOME') ?: project.rootDir.absolutePath

    jvmArgs = [
        '--add-exports', 'java.base/jdk.internal.misc=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '-Dfile.encoding=UTF-8',
        '-Djava.awt.headless=true'
    ]

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

java {
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(Javadoc) {
	failOnError false
	options.addStringOption('Xdoclint:none', '-quiet')
	options.addStringOption('encoding', 'UTF-8')
	options.addStringOption('charSet', 'UTF-8')
}


def entityType = 'D'
version = System.getenv("ADEMPIERE_LIBRARY_VERSION") ?: "local-1.0.0"

jar {
	manifest {
		attributes(
			"Implementation-Title": "Adempiere Base Test Module",
			"Implementation-Version": version,
			"EntityType": entityType
		)
	}
}

publishing {
    repositories {
		mavenLocal()

        maven {
            url = "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
            credentials {
				username = findProperty("sonatypeUsername")
				password = findProperty("sonatypePassword")
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
        	groupId 'io.github.adempiere'
            artifactId 'base.test'
            version
           	from components.java
           	pom {
                name = 'Base Test'
                description = 'Base Test api dedicated to manage project, and members.'
                url = 'http://adempiere.io/'
                licenses {
                    license {
                        name = 'GNU General Public License, version 2'
                        url = 'https://www.gnu.org/licenses/old-licenses/gpl-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'yamelsenih'
                        name = 'Yamel Senih'
                        email = 'ysenih@erpya.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/adempiere/adempiere.git'
                    developerConnection = 'scm:git:ssh://github.com/adempiere/adempiere.git'
                    url = 'http://github.com/adempiere/adempiere'
                }
            }
		}
	}
}


task cleanBuildPublishLocal(type: GradleBuild) {
	tasks = ['clean', 'build', 'publishToMavenLocal']
}


signing {
	def isReleaseVersion = !version.toString().startsWith("local") && !version.toString().endsWith("-SNAPSHOT")

	setRequired {
		// signing is required if this is a release version and the artifacts are to be published
		// do not use hasTask() as this require realization of the tasks that maybe are not necessary
		(isReleaseVersion || version.toString().equals("build")) && gradle.taskGraph.allTasks.any {
			it.equals(PublishToMavenRepository)
		}
	}

	def signingKey = findProperty("signingKey")
	def signingPassword = findProperty("signingPassword")
	sign configurations.archives
	sign publishing.publications.mavenJava
}
