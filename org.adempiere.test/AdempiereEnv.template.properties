#  Adempiere test connection template (ScalaTest via ant scala-test).
#
#  Copied by the scala-test target to build/scala-test/Adempiere.properties
#  (gitignored) and passed to the JVM as -DPropertyFile, because Ini.saveProperties
#  rewrites the file it loads with machine-specific values.
#
#  Defaults match the documented local development database:
#    host=localhost port=5432 database=adempiere user=adempiere password=adempiere
#
#  Override the whole file for a different environment with:
#    ant -f utils_dev/build.xml scala-test -Dscala.test.propertyfile=/path/to/Adempiere.properties
#
#  The Connection value is the CConnection.toStringLong() format parsed by
#  CConnection.setAttributes; the leading "xyz" marker means "not encrypted"
#  (SecureEngine.decrypt returns the input unchanged for it).
Connection=xyzCConnection[name\=localhost{adempiere-localhost-adempiere-adempiere},AppsHost\=localhost,AppsPort\=0,type\=PostgreSQL,DBhost\=localhost,DBport\=5432,DBname\=adempiere,BQ\=false,FW\=false,FWhost\=,FWport\=0,UID\=adempiere,PWD\=adempiere]
DataSource=java:adempiereDB
ValidateConnectionOnStartup=xyzN
